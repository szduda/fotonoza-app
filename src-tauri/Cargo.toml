[package]
name = "fotonoza"
version = "0.1.0"
description = "Fast open source photo workflow app"
authors = ["fotonoza contributors"]
edition = "2021"

[lib]
name = "fotonoza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0.1"
tauri-plugin-fs = "2.0.1"
tauri-plugin-shell = "2.0.1"
image = "0.25"
rayon = "1.10"
dirs = "6"
kamadak-exif = "0.6"
